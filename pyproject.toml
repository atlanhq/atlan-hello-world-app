[project]
name = "hello-world"
version = "1.0.0"
description = "Reference 'hello world' app for the Atlan Application SDK"
requires-python = ">=3.11"
dependencies = [
    "atlan-application-sdk>=3.13.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Pin the resolver's default index (conformance D012). Without this the resolver
# inherits whatever default the machine supplies, and on an Atlan laptop that is
# the Endor Labs package firewall configured in ~/.config/uv/uv.toml. Every
# `uv run` / `uv sync` / `uv lock` then rewrites every package URL in uv.lock to
# that credentialed proxy — silently, with no version or hash change — and CI,
# which holds no credential for that host, fails at dependency install with 401
# Unauthorized. This has already happened once in this repo.
#
# It belongs here rather than in a project-level uv.toml: a uv.toml suppresses
# [tool.uv] entirely, which would silently drop any constraint-dependencies CVE
# floors declared there.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "atlan-application-sdk[tests]>=3.0.0,<4.0.0",
    "atlan-application-sdk-conformance<=1.0.0",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pre-commit>=4.2.0,<5",
    "poethepoet>=0.34.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = false

# The integration tier is no longer exempt: tests/integration/ runs the App on
# the SDK's integration fixture kit, which needs no external system — an
# embedded Temporal dev server, mocked stores and a real in-process worker.
#
# e2e stays exempt. That tier is the full pipeline including system apps, in
# SDR mode against a real tenant, and hello-world has self_deployed_runtime:
# false with no system-app integration to exercise. Revisit if that changes.
[tool.conformance]
exempt_test_tiers = ["e2e"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Must match the fixture loop scope. The kit's embedded_temporal / temporal_client
# / worker fixtures are pinned loop_scope="session", and the integration tests
# await work those fixtures' loop has to service. Left unset this defaults to
# "function", which does not fail — it HANGS until the suite timeout
# (conformance rule T019).
asyncio_default_test_loop_scope = "session"
# The unit tier only. The integration tier boots an embedded Temporal server,
# so it is opted into explicitly — `make test-integration` locally, and the
# `test-paths` input in .github/workflows/tests.yaml in CI.
testpaths = ["tests/unit"]
markers = [
    "integration: runs the App against the SDK integration fixture kit (embedded Temporal); deselected from the unit job",
]

[tool.poe.tasks]
# Regenerate atlan.yaml, app.yaml, and app/generated/ from contract/app.pkl.
# Mirrors the Makefile `generate` target; used by the SDK Certify publish step.
generate = "pkl eval --project-dir contract -m . contract/app.pkl"
start-dapr = "dapr run --enable-api-logging --log-level debug --app-id app --app-port 8000 --dapr-http-port 3500 --dapr-grpc-port 50001 --scheduler-host-address '' --placement-host-address '' --max-body-size 1024Mi --config components/configuration.yaml --resources-path components"
start-temporal = "temporal server start-dev --db-filename ./tmp/temporal.db"
start-deps.shell = "mkdir -p tmp && poe start-dapr & poe start-temporal &"
stop-deps.shell = "lsof -ti:3500,7233,8233,50001 | xargs kill -9 2>/dev/null || true"

# Copy Dapr component YAMLs bundled in the installed atlan-application-sdk
# wheel, so components stay in sync with whatever SDK version is locked.
[tool.poe.tasks.download-components]
interpreter = "python"
shell = """
import pathlib, shutil
import application_sdk

src = pathlib.Path(application_sdk.__file__).parent / "components"
shutil.copytree(src, "components", dirs_exist_ok=True)
"""

[tool.ruff]
line-length = 100
target-version = "py311"
# Bootstrap-managed vendor file (conformance C002) — its canonical formatting
# doesn't survive ruff-format's line-collapsing, causing the two gates to
# fight each other. Content is fully dictated by `bootstrap`, never hand-edited.
extend-exclude = [".github/scripts/build_conformance_args.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
extend-select = ["G001", "G003", "G004", "T201", "LOG009"]
