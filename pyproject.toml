[project]
name = "hello-world"
version = "0.1.0"
description = "Reference 'hello world' app for the Atlan Application SDK"
requires-python = ">=3.11"
dependencies = [
    "atlan-application-sdk>=3.8.1,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "atlan-application-sdk[tests]>=3.8.1,<4.0.0",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pre-commit>=4.2.0,<5",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
