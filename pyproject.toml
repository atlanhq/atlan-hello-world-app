[project]
name = "hello-world"
version = "0.1.0"
description = "Reference 'hello world' app for the Atlan Application SDK"
requires-python = ">=3.11"
dependencies = [
    "atlan-application-sdk>=3.13.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "atlan-application-sdk[tests]>=3.0.0,<4.0.0",
    "atlan-application-sdk-conformance>=0.1.0,<1.0.0",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pre-commit>=4.2.0,<5",
    "poethepoet>=0.34.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests/unit"]

[tool.poe.tasks]
start-dapr = "dapr run --enable-api-logging --log-level debug --app-id app --app-port 8000 --dapr-http-port 3500 --dapr-grpc-port 50001 --scheduler-host-address '' --placement-host-address '' --max-body-size 1024Mi --config components/configuration.yaml --resources-path components"
start-temporal = "temporal server start-dev --db-filename ./tmp/temporal.db"
start-deps.shell = "mkdir -p tmp && poe start-dapr & poe start-temporal &"
stop-deps.shell = "lsof -ti:3500,7233,8233,50001 | xargs kill -9 2>/dev/null || true"

# Download Dapr component YAMLs from application-sdk. SDK_VERSION matches the
# minimum pin in [project.dependencies] so components stay in sync with the SDK.
[tool.poe.tasks.download-components]
interpreter = "python"
env = { SDK_VERSION = "v3.13.4" }
shell = """
import json, os, pathlib, urllib.request

components_dir = pathlib.Path("components")
components_dir.mkdir(exist_ok=True)

api_url = "https://api.github.com/repos/atlanhq/application-sdk/contents/components"
req = urllib.request.Request(f"{api_url}?ref={os.environ['SDK_VERSION']}")
with urllib.request.urlopen(req) as resp:
    files = json.loads(resp.read())

for f in files:
    if f["type"] == "file" and f["name"].endswith(".yaml"):
        with urllib.request.urlopen(f["download_url"]) as resp:
            (components_dir / f["name"]).write_bytes(resp.read())
        print(f"Downloaded: {f['name']}")
"""

[tool.ruff]
line-length = 100
target-version = "py311"
# Bootstrap-managed vendor file (conformance C002) — its canonical formatting
# doesn't survive ruff-format's line-collapsing, causing the two gates to
# fight each other. Content is fully dictated by `bootstrap`, never hand-edited.
extend-exclude = [".github/scripts/build_conformance_args.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
extend-select = ["G001", "G003", "G004", "T201", "LOG009"]
