[project]
name = "hello-world"
version = "0.1.0"
description = "Reference 'hello world' app for the Atlan Application SDK"
requires-python = ">=3.11"
dependencies = [
    "atlan-application-sdk>=3.13.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "atlan-application-sdk[tests]>=3.0.0,<4.0.0",
    "atlan-application-sdk-conformance>=0.1.0,<1.0.0",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pre-commit>=4.2.0,<5",
    "poethepoet>=0.34.0",
]

# Supply-chain cooldown (org security baseline §5): a version must have been
# public for 7 days before any resolution here can pick it up. It lives in
# config, not in a `uv lock --exclude-newer` command, because uv writes its
# resolver settings into uv.lock under `[options]` and every consumer that
# validates the lock — `uv sync --locked` in the Dockerfile — compares its own
# settings against that block. A bound supplied only to the locking command
# produces a lock the image build then rejects as stale (FND-367). Renovate's
# lock refresh shells out to uv and inherits this with nothing to configure.
#
# Exemptions are Atlan's own published packages: the cooldown guards against an
# unvetted third-party publisher, which is not what we are to ourselves, and a
# 7-day hold would stall the fleet's own release loop. pyatlan is exempt for the
# same reason and is load-bearing here — the SDK pins `pyatlan>=10,<11`, and
# `exclude-newer` bounds the floor a pin REQUIRES, not just the ceiling an
# upgrade would reach, so without this the project is unresolvable rather than
# merely stale. Keep in step with the cooldown exemption packageRule in the
# fleet preset (atlanhq/application-sdk//renovate-config/default.json).
[tool.uv]
exclude-newer = "P7D"
exclude-newer-package = { atlan-application-sdk = "P0D", atlan-application-sdk-conformance = "P0D", pyatlan = "P0D" }

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = false

# hello-world is a reference scaffold with no external system to connect to
# and self_deployed_runtime: false — there is nothing for an integration or
# e2e suite to exercise yet. Revisit if this app grows a real connector.
[tool.conformance]
exempt_test_tiers = ["integration", "e2e"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests/unit"]

[tool.poe.tasks]
# Regenerate atlan.yaml, app.yaml, and app/generated/ from contract/app.pkl.
# Mirrors the Makefile `generate` target; used by the SDK Certify publish step.
generate = "pkl eval --project-dir contract -m . contract/app.pkl"
start-dapr = "dapr run --enable-api-logging --log-level debug --app-id app --app-port 8000 --dapr-http-port 3500 --dapr-grpc-port 50001 --scheduler-host-address '' --placement-host-address '' --max-body-size 1024Mi --config components/configuration.yaml --resources-path components"
start-temporal = "temporal server start-dev --db-filename ./tmp/temporal.db"
start-deps.shell = "mkdir -p tmp && poe start-dapr & poe start-temporal &"
stop-deps.shell = "lsof -ti:3500,7233,8233,50001 | xargs kill -9 2>/dev/null || true"

# Copy Dapr component YAMLs bundled in the installed atlan-application-sdk
# wheel, so components stay in sync with whatever SDK version is locked.
[tool.poe.tasks.download-components]
interpreter = "python"
shell = """
import pathlib, shutil
import application_sdk

src = pathlib.Path(application_sdk.__file__).parent / "components"
shutil.copytree(src, "components", dirs_exist_ok=True)
"""

[tool.ruff]
line-length = 100
target-version = "py311"
# Bootstrap-managed vendor file (conformance C002) — its canonical formatting
# doesn't survive ruff-format's line-collapsing, causing the two gates to
# fight each other. Content is fully dictated by `bootstrap`, never hand-edited.
extend-exclude = [".github/scripts/build_conformance_args.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
extend-select = ["G001", "G003", "G004", "T201", "LOG009"]
