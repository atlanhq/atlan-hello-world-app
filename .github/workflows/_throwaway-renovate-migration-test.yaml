name: _throwaway Renovate Auto-Approve Migration Test
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Any real PR number in this repo (doesn't need to be a Renovate PR -- the reusable's own author guard exits cleanly before any mutation)
        required: true
        type: string
jobs:
  test-old-style-explicit-secret:
    uses: atlanhq/application-sdk/.github/workflows/renovate-auto-approve-reusable.yml@phase2-category-a
    with:
      event_name: workflow_dispatch
      pr_number: ${{ inputs.pr_number }}
    secrets:
      org_pat: ${{ secrets.ORG_PAT_GITHUB }}

  test-new-style-inherit:
    uses: atlanhq/application-sdk/.github/workflows/renovate-auto-approve-reusable.yml@phase2-category-a
    with:
      event_name: workflow_dispatch
      pr_number: ${{ inputs.pr_number }}
    secrets: inherit
