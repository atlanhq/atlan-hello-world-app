# Throwaway — verifies that a GitHub Release created with a minted App
# installation token triggers on:release workflows in the SAME repo, the
# way tag-and-release.yaml's callers depend on. Delete after confirmed.
name: _throwaway Release Re-fire Test
on:
  release:
    types: [released]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  observe:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - run: echo "RELEASE EVENT FIRED. actor=${{ github.actor }} tag=${{ github.event.release.tag_name }}"

  create-release-with-app-token:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Mint fleet App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: atlan-hello-world-app

      - uses: actions/checkout@v7

      - name: Create a throwaway release with the App token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          TAG="throwaway-release-refire-test-$(date +%s)"
          gh release create "$TAG" --title "$TAG" --notes "Throwaway release re-fire test." --target main
