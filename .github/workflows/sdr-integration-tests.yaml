name: SDR Integration Tests

# Runs the customer-style SDR end-to-end suite. Gated on the `sdr-e2e-test`
# PR label so unrelated PRs don't pay the container build cost; the SDK's
# composite action posts a "skipped" status when the label is absent so
# branch-protection can list this job as required without blocking other PRs.
#
# Branch-protection target: "SDR Integration Tests / SDR E2E Tests"

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]
    branches: [main]
  workflow_dispatch:

jobs:
  sdr-tests:
    name: SDR E2E Tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'sdr-e2e-test') ||
      contains(github.event.pull_request.labels.*.name, 'sdr-e2e-test')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sdr-integration-tests-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      contents: read
      statuses: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: atlanhq/application-sdk/.github/actions/sdr-e2e@main
        with:
          app-name: hello-world
          app-image-name: atlan-hello-world-app
